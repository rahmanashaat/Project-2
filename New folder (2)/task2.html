<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sport car table</title>
</head>
    <style>
        table {
            border-collapse: collapse;
            width: 60%;
            margin: 20px;
        }

        td, th {
            border: 1px solid #333;
            padding: 10px;
            text-align: center;
        }

        th {
            background-color: #f2f2f2;
        }
    </style>
<body>
    <caption><b>Sports Car Brands</b></caption>
    <table border="3">
        <tr>
            <th>*</th>
            <th>Brand</th>
            <th>Country</th>
        </tr>
        <tr>
            <td>1</td>
            <td>Ferrari</td>
            <td>Italy</td>
        </tr>
        <tr>
            <td>2</td>
            <td>Lamborghini</td>
            <td>Italy</td>
        </tr>
        <tr>
            <td>3</td>
            <td>Porsche</td>
            <td>Germany</td>
        </tr>
        <tr>
            <td>4</td>
            <td>Chevrolet Corvette</td>
            <td>USA</td>
        </tr>
    </table>
</body>
</html>
