<!DOCTYPE html>
<html>
<head>
  <title>Registration Form</title>
  <style>
    table {
      border: 3px solid rgb(0, 128, 96);
      width: 400px;
      margin: auto;
      border-collapse: collapse;
      font-family: Arial, sans-serif;
    }
    th {
      background-color: #f2f2f2;
      text-align: center;
      font-size: 20px;
      border: 1px solid rgb(0, 98, 128);
      padding: 8px;
    }
    td {
      border: 1px solid rgb(128, 0, 32);
      padding: 5px;
      vertical-align: top;
    }
    input[type="text"],
    input[type="password"],
    select,
    textarea {
      width: 100%;
    }
    .buttons {
      text-align: center;
    }
  </style>
</head>
<body>
  <form>
    <table>
      <tr>
        <th colspan="2">Registration Form</th>
      </tr>
      <tr>
        <td>First Name</td>
        <td><input type="text" name="fname"></td>
      </tr>
      <tr>
        <td>Last Name</td>
        <td><input type="text" name="lname"></td>
      </tr>
      <tr>
        <td>User Name</td>
        <td><input type="text" name="username"></td>
      </tr>
      <tr>
        <td>Pass</td>
        <td><input type="password" name="pass"></td>
      </tr>
      <tr>
        <td>Track</td>
        <td>
          <select name="track">
            <option value="BI">BI</option>
            <option value="CS">CS</option>
            <option value="IT">IT</option>
            <option value="PHP"></option>
            <option value="Python"></option>
          </select>
        </td>
      </tr>
      <tr>
        <td rowspan="2">Gender</td>
        <td><input type="radio" name="gender" value="male"> Male</td>
      </tr>
      <tr>
        <td><input type="radio" name="gender" value="female"> Female</td>
      </tr>
      <tr>
        <td rowspan="3">Favourites</td>
        <td>
          <input type="checkbox" name="fav" value="football"> Football
          <input type="checkbox" name="fav" value="basketball"> Basketball<br>
          <input type="checkbox" name="fav" value="games"> Games
          <input type="checkbox" name="fav" value="reading"> Reading<br>
          <input type="checkbox" name="fav" value="swimming"> Swimming
          <input type="checkbox" name="fav" value="travel"> Travel
        </td>
      </tr>
      <tr>
        <td><textarea name="description" rows="4" placeholder="Description"></textarea></td>
      </tr>
      <tr>
        <td colspan="2" class="buttons">
          <input type="submit" value="Submit">
          <input type="reset" value="Reset">
        </td>
      </tr>
      <tr>
        <td colspan="2"><input type="file" name="file"></td>
      </tr>
    </table>
  </form>

</body>
</html>
